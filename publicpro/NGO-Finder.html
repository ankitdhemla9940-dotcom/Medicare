<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="Css/medfinder.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>

        let myModule = angular.module("Modulekuch", []);
        let mycontroller = myModule.controller("controllerkuch", function ($scope, $http) {

            $scope.dofillcities1 = function () {
                let url = "/fill-citiesngo";

                $http.get(url).then(function (resp) {

                    $scope.jsonArycities = resp.data;

                }, function (err) {

                    alert(err);
                })
            }
            $scope.showcitymed = function (city) {
                let url = "city-med?citykey=" + city;

                $http.get(url).then(function (resp) {

                    $scope.jsoncitymed = resp.data;

                }, function (err) {

                    alert(err);
                })
            }
            $scope.doShowSelNGO = function (city) {

                let url = "/NGO-details?citykey=" + city;

                $http.get(url).then(function (resp) {

                    $scope.jsonngo = resp.data;

                }, function (err) {

                    alert(err);
                })
            }

            $scope.showdetails = function (email, medicine) {

                let url = "/show-detail?emailkey=" + email + "&medkey=" + medicine;

                $http.get(url).then(function (resp) {

                    $scope.jsondetail = resp.data;

                }, function (err) {

                    alert(err);
                })
            }



        })
    </script>
</head>

<body ng-app="Modulekuch" ng-controller="controllerkuch" ng-init="dofillcities1();">



    <!-- As a heading -->
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="/index.html" style="gap:10px;"><img src="images/medicare-logo.png" alt="Medicare Logo" style="height:38px;width:38px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(13,148,136,0.4));"><span style="font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,#0d9488,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;">Medicare</span></a>
        </div>
    </nav>
    <br>


    <div class="row">
        <div class="offset-md-5 col-md-6">
            <label>City</label><br>

            <input list="city-list" ng-model="selcity" placeholder="Type or select...">
            <datalist id="city-list">
                <option ng-repeat="obj in jsonArycities" value={{obj.city}}>{{obj.city}}</option>

            </datalist>

            <input type="button" value="Search NGO" ng-click="doShowSelNGO(selcity);">
        </div>

    </div>
    <br><br>

    <div>
        <table class="table table-dark w-auto" border="2">
            <tr class="table table-dark">
                <th class="table table-dark">Sr. No</th>
                <th class="table table-dark">Email ID</th>
                <th class="table table-dark">NGO Name</th>
                <th class="table table-dark">Reg. Office</th>
                <th class="table table-dark">City</th>
                <th class="table table-dark">Website</th>
                <th class="table table-dark">Contact No.</th>
                <th class="table table-dark">Since</th>
                <th class="table table-dark">Chair Person</th>
                <th class="table table-dark">NGO Work</th>
                <th class="table table-dark">Registration No.</th>
            </tr>

            <tr ng-repeat="obj in jsonngo">

                <td>{{$index+1}}</td>
                <td>{{obj.emailid}}</td>
                <td>{{obj.ngo}}</td>
                <td>{{obj.regoffice}}</td>
                <td>{{obj.city}}</td>
                <td>{{obj.website}}</td>
                <td>{{obj.contactno}}</td>
                <td>{{obj.since}}</td>
                <td>{{obj.chairperson}}</td>
                <td>{{obj.ngoworks}}</td>
                <td>{{obj.regnumber}}</td>

            </tr>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

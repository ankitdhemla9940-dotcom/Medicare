<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="Css/profile.css">

    <script>
        function doprev(fileCtrl, prev) {
            const file = fileCtrl.files[0];

            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }


    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>

        function fdisable(txt,radsale)
        {
                txt.disabled=false;
    
        }
        function tdisable(txt,radsale)
        {
                txt.disabled=true;
    
        }
    </script>    



</head>


<body style="background-color: rgb(253, 251, 251);">

    <div>
        <center style="margin-bottom: 20px; margin-top: 10px;">
            <h4>Avail Medical Equipment</h4>
        </center>
    </div>

    <div class="container-fluid" style="max-width:960px;">
    <form action="/avail-med-equip" method="post" enctype="multipart/form-data" class="row g-3 needs-validation"
        novalidate>

        <div class="col-12 col-md-8">
            <label for="txtemail" class="form-label">Emailid</label>
            <input type="email" class="form-control" name="txtemail" id="txtemail" value="mark@example.com" required>
        </div>
        <div class="col-12 col-md-6">
            <label for="equipname" class="form-label">Medical Equipment</label>
            <input type="text" class="form-control" name="equipname" id="equipname" value="" required>
        </div>
        <div class="col-12 col-md-6">
            <label for="Conditon" class="form-label">Condition</label>
            <select class="form-select" name="Condition" id="Condition" required>
                <option selected disabled value="">Condition</option>
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Bad">Bad</option>

            </select>

        </div>

        <div class="row">
            <div class="col-md-6" style="margin-top: 20px;">
                <label for="type" class="form-label">Type of Donating</label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4" style="margin-top: 10px;">
                <input type="radio" id="raddon" name="type" value="Donation" onclick="tdisable(txtamount,raddon);">Donation
            </div>
            <div class="col-md-4" style="margin-top: 10px;">
                <input type="radio" id="radsale" name="type" value="For Sale" onclick="fdisable(txtamount,radsale);">For Sale
            </div>
            <div class="col-md-4" style="margin-top: 10px;">
                <label for="txtamount" class="form-label">Amount</label>
                <input type="text" id="txtamount" name="Amount" value="0" disabled >
            </div>
        </div>


        <div class="  offset-md-2 col-md-4 justify-content-center">
            <label for="validationCustom06" class="form-label">Upload Medical Equipment(Left Side)</label>
            <input type="file" class="form-control" name="equipimage1" id="validationCustom06" onchange="doprev(this,prevequip1)" required>
            <img src="" id="prevequip1" width="200px" height="150px">

        </div>
        <div class=" col-md-4  justify-content-center">
            <label for="validationCustom06" class="form-label">Upload Medical Equipment(Right Side)</label>
            <input type="file" class="form-control" name="equipimage2" id="validationCustom06" onchange="doprev(this,prevequip2)" required>
            <img src="" id="prevequip2" width="200px" height="150px">

        </div>

        
        <div class="col-md-12">
            <label for="oinfo" name="oinfo" class="form-label">Other Information</label>
            <textarea cols="100" rows="4"  class="form-control" name="oinfo" id="oinfo" required></textarea>
        </div>

        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">
                    Agree to terms and conditions
                </label>
                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>
        </div>
        <div class=" offset-md-3 col-md-6">
            <center><button class="btn btn-primary" id="btnavail" type="submit">Avail Medical Equipment</button></center>
        </div>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>

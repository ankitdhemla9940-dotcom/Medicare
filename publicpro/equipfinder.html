<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="Css/medfinder.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>

        let myModule = angular.module("Modulekuch", []);
        let mycontroller = myModule.controller("controllerkuch", function ($scope, $http) {

            $scope.dofillcities = function () {
                let url = "/fill-cities";

                $http.get(url).then(function (resp) {

                    $scope.jsonArycities = resp.data;

                }, function (err) {

                    alert(err);
                })
            }
            $scope.showcityequip = function (city) {
                let url = "city-equip?citykey=" + city;

                $http.get(url).then(function (resp) {

                    $scope.jsoncityequip = resp.data;

                }, function (err) {

                    alert(err);
                })
            }
            $scope.doShowSelequip = function (city, equip) {

                let url = "/equip-overview?citykey=" + city + "&equipkey=" + equip;

                $http.get(url).then(function (resp) {

                    $scope.jsonequipment = resp.data;

                }, function (err) {

                    alert(err);
                })
            }

            $scope.doshowdetails = function (email, equip) {

                let url = "/show-detailequip?emailkey=" + email + "&equipkey=" + equip;

                $http.get(url).then(function (resp) {

                    $scope.jsondetail = resp.data;

                }, function (err) {

                    alert(err);
                })
            }



        })
    </script>
</head>

<body ng-app="Modulekuch" ng-controller="controllerkuch" ng-init="dofillcities();">



    <!-- As a heading -->
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Navbar</span>
        </div>
    </nav>
    <br>

    <div class="row">

        <div class="offset-md-3 col-md-3">

            <label for="">City</label><br>
            <select style="width: 200px;" ng-model="selcity" ng-change="showcityequip(selcity);">
                <option ng-repeat="obj in jsonArycities" value={{obj.city}}>{{obj.city}}</option>
            </select>
        </div>

        <div class="offset-md-1 col-md-3">
            <label>Search Equipment</label><br>

            <input list="state-list" ng-model="selequip" placeholder="Type or select...">
            <datalist id="state-list">
                <option ng-repeat="obj in jsoncityequip" value={{obj.equipment}}>{{obj.equipment}}</option>

            </datalist>

            <input type="button" value="Search Donor" ng-click="doShowSelequip(selcity,selequip);">
        </div>
    </div>
    <br><br>

    <div class="d-flex flex-wrap justify-content-center gap-5 mt-5">
        <div class=" col-md-2" ng-repeat="obj in jsonequipment">

            <div class="card" style="width:220px; height:350px;">
                <img src="{{obj.pic1url}}" class="card-img-top" style="height:100px; width:100%; object-fit:cover;">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{obj.emailid}}</h5>
                    <p class="card-text">{{obj.equipment}}</p>
                    <p class="card-text">{{obj.info}}</p>

                    <input type="button" class="btn btn-primary mt-auto align-self-center" data-bs-toggle="modal" data-bs-target="#exampleModal" ng-click="doshowdetails(obj.emailid,obj.equipment)" value="More Details">
                </div>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Equipment Details</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <table class="table table-dark w-auto" border="2">
                                <tr class="table table-dark">
                                    <th class="table table-dark">Sr. No</th>
                                    <th class="table table-dark">Email ID</th>
                                    <th class="table table-dark">Equipment</th>
                                    <th class="table table-dark">Condition</th>
                                    <th class="table table-dark">Type</th>
                                    <th class="table table-dark">Amount</th>
                                    <th class="table table-dark">Information</th>
                                    <th class="table table-dark">Equipment Pic1</th>
                                    <th class="table table-dark">Equipment Pic2</th>
                                    
                                </tr>

                                <tr ng-repeat="obj in jsondetail">

                                    <td>{{$index+1}}</td>
                                    <td>{{obj.emailid}}</td>
                                    <td>{{obj.equipment}}</td>
                                    <td>{{obj.conditioon}}</td>
                                    <td>{{obj.dtype}}</td>
                                    <td>{{obj.amount}}</td>
                                    <td>{{obj.info}}</td>
                                    <td>
                                        <center>
                                            <img src={{obj.pic1url}} width="50px" height="50px" alt="">
                                        </center>
                                    </td>
                                    <td>
                                        <center>
                                            <img src={{obj.pic2url}} width="50px" height="50px" alt="">
                                        </center>
                                    </td>

                                </tr>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary">Save changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
